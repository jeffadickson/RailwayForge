name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build & Test
        run: |
          dotnet build RailwayForge.sln -c Release --no-incremental /warnaserror
          dotnet test RailwayForge.sln -c Release --no-build

      - name: Pack Packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.0.0"; fi
          for proj in src/RailwayForge src/RailwayForge.Analyzers src/RailwayForge.AspNetCore src/RailwayForge.OpenTelemetry; do
            dotnet pack "$proj" -c Release --no-build -p:PackageVersion="$VERSION" -o ./artifacts/nupkg
          done

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Push to NuGet.org (when NUGET_API_KEY secret is configured)
        if: ${{ secrets.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push ./artifacts/nupkg/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate
